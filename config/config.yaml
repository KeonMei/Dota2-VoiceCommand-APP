# =============================================================================
# Main application config. Nothing is hardcoded in the code - all paths,
# timings and recognition parameters live here.
# =============================================================================

speech:
  # Path to the unpacked offline Vosk model (see README for installation/calibration).
  # Download the model: https://alphacephei.com/vosk/models (vosk-model-small-ru-0.22
  # for speed, vosk-model-ru-0.42 for accuracy).
  model_path: "models/vosk-model-small-ru-0.22"
  # Recognize only the words used by commands (phrases in commands.yaml plus
  # role synonyms); any other speech comes out as "unknown" and is ignored.
  # Much more accurate for commands than free recognition. Words the model
  # doesn't know (e.g. "мидер") can't be heard at all - they're listed in the
  # log at startup; use a known form ("мид", "мида") in synonyms instead.
  restrict_vocabulary: true
  # Additional words to allow in restricted mode without adding a phrase.
  extra_words: []
  sample_rate: 16000
  # Microphone name as shown in the Settings window (an index also works).
  # null = system default device.
  input_device: "Микрофон (HyperX Cloud III)"
  # Listen without an activation keyword - every phrase is checked against the command list.
  wake_word_required: false

hotkeys:
  # Global hotkey to toggle microphone listening on/off (via the `keyboard` library).
  toggle_listening: "ctrl+alt+l"

apps:
  steam:
    path: "C:/Program Files (x86)/Steam/Steam.exe"
    process_name: "steam.exe"
    window_title_substr: "Steam"
    launch_args: []
  chrome:
    path: "C:/Program Files/Google/Chrome/Application/chrome.exe"
    process_name: "chrome.exe"
    window_title_substr: "Chrome"
  discord:
    # %LOCALAPPDATA% is expanded automatically when the config is loaded.
    path: "%LOCALAPPDATA%/Discord/Update.exe"
    launch_args: ["--processStart", "Discord.exe"]
    process_name: "Discord.exe"
    window_title_substr: "Discord"

dota2:
  app_id: 570
  process_name: "dota2.exe"
  window_title_substr: "Dota 2"

timeouts:
  steam_ready_sec: 60          # wait for the Steam client to fully load
  dota_ready_sec: 90           # wait for the Dota 2 window to appear after launch
  # The window can exist long before the main menu (Panorama UI) has actually
  # finished loading - ensure_dota_ready polls for the Play button itself up
  # to this long instead of guessing a fixed delay after a fresh launch.
  dota_menu_ready_sec: 60
  process_launch_sec: 15       # wait for the process to appear after launching the exe
  generic_step_sec: 10

delays:
  after_steam_launch: 3
  # Pause after the Chrome window appears, before opening the Yandex Music tab.
  after_chrome_launch: 1
  between_ui_clicks: 0.3

vision:
  # Folder with reference screenshots of UI elements (see tools/calibrate.py).
  # Optional: templates/intro_splash*.png (any number, e.g. intro_splash_1.png,
  # intro_splash_2.png) - if present, ensure_dota_ready watches for them on a
  # fresh launch and presses Escape the moment any one of them is actually
  # detected, instead of guessing. Absent by default; nothing here just waits
  # for the Play button as before. The splash is usually animated, so hand-
  # timing one screenshot rarely lands on the right frame - calibrate a whole
  # burst of frames instead: `python tools/calibrate.py --burst intro_splash`
  # (see that command's --help for how it works).
  templates_dir: "templates"
  # Template matching score threshold (0..1). Higher = stricter.
  match_threshold: 0.86
  # How many times to retry finding a template on screen before giving up.
  max_retries: 2
  retry_delay_sec: 0.4
  # Resolution the current templates were calibrated for (for reference/warnings).
  calibrated_resolution: [1920, 1080]
  region_mode_list: [1534, 611, 328, 298]
  region_role_icons: [1540, 587, 213, 131]
  # Optional named search regions: [left, top, width, height], written by
  # `python tools/calibrate.py --region <name>`. A step with a matching
  # `region_key: <name>` then searches only this rectangle instead of the
  # full screen - much faster. None are set by default, which is a safe
  # no-op: every step still searches the whole screen until you calibrate
  # one (e.g. `python tools/calibrate.py --region role_icons`).

automation:
  # How long the mouse takes to glide to a UI element before clicking, in
  # seconds. Purely cosmetic - lower feels snappier/more robotic, higher
  # feels smoother and more human (but slows down the whole sequence a bit).
  move_duration: 0.45
  # Easing curve applied over that duration:
  #   linear       - constant speed the whole way (the old, robotic default)
  #   ease_in_out  - starts slow, speeds up, eases into the target (natural)
  #   ease_out     - moves quickly then eases into the target
  #   ease_in      - starts slow then accelerates into the target
  move_tween: "ease_in_out"
  # A hovered button is highlighted and stops matching its template (clicking
  # "Играть" leaves the cursor right where "Найти игру" appears), so after a
  # miss the cursor steps aside by this many pixels and the element is looked
  # for once more. The step is widened when needed so it clears the element
  # itself. Only happens when something wasn't found.
  cursor_nudge_px: 120
  # Fixed spot to move the cursor to instead of a step aside, e.g. [960, 540].
  # null = step aside by cursor_nudge_px.
  cursor_park: null

feedback:
  tts_enabled: true
  # "piper" - offline neural voice (natural-sounding, needs a downloaded model,
  #           see piper_model). Falls back to "sapi" if the model is missing.
  # "sapi"  - built-in Windows voice via pyttsx3 (tts_rate / tts_voice below).
  tts_engine: "piper"
  # Piper voice model (.onnx, with its .onnx.json next to it). Russian voices:
  # ru_RU-dmitri-medium, ru_RU-denis-medium, ru_RU-ruslan-medium (male),
  # ru_RU-irina-medium (female). Download one with:
  #   python -m piper.download_voices ru_RU-denis-medium --data-dir models/piper
  piper_model: "models/piper/ru_RU-denis-medium.onnx"
  # Speech tempo for Piper: 1.0 = normal, >1 slower, <1 faster.
  piper_length_scale: 0.9
  # Speech rate for the "sapi" engine (words per minute).
  tts_rate: 175
  # Playback volume, 0.0-1.0. The default Windows SAPI5 voice can sound harsh
  # at full volume - lowering this often helps on its own.
  tts_volume: 0.15
  # Case-insensitive substring matched against installed voice names/ids
  # (see: python tools/list_voices.py). null = use the system default voice
  # (usually a robotic-sounding one like "Microsoft Irina").
  tts_voice: null
  beep_on_command_recognized: false
  log_file: "logs/app.log"
  log_level: "INFO"

# Roles and their voice synonyms - used by the command
# matcher. "ё" and "е" are treated as the same letter. When a phrase fits
# several synonyms equally well, the longer one wins ("хард саппорт" beats
# "хард"). The key is the canonical role id, substituted into template filenames
# (templates/role_<id>.png) and into the executor's commands.
roles:
  carry:
    label: "Керри"
    synonyms: ["керри", "кэрри", "карри", "кери", "кэри", "оффкор", "первая позиция", "первую позицию",
               "позиция один", "первый", "единица", "единицу"]
  mid:
    label: "Мидер"
    synonyms: ["мидер", "мид", "мида", "миду", "миде", "мидл", "мидлер", "миддер", "центр",
               "вторая позиция", "вторую позицию", "позиция два", "второй", "двойка", "двойку"]
  offlane:
    label: "Оффлейнер"
    synonyms: ["хард", "харду", "оффлейнер", "оффлейн", "офлейн", "оффлайн", "офлайн", "хардлейн",
               "третья позиция", "третью позицию", "позиция три", "третий", "тройка", "тройку"]
  support:
    label: "Поддержка"
    synonyms: ["поддержка", "поддержку", "саппорт", "саппорта", "суппорт", "суппорта", "софт",
               "софт саппорт", "четвертая позиция", "четвертую позицию", "позиция четыре", "четвертый",
               "четверка", "четверку"]
  hard_support:
    label: "Полная поддержка"
    synonyms: ["полная поддержка", "полную поддержку", "хард саппорт", "хард суппорт", "хардсаппорт",
               "пятая позиция", "пятую позицию", "позиция пять", "пятый", "пятерка", "пятерку"]

# Normal-game modes, in the order they're listed in Dota 2. The key is the
# mode id used in template filenames: templates/mode_<id>.png (checkbox +
# label, unticked) and templates/mode_<id>_selected.png (same crop, ticked).
# select_exclusive_mode unticks every listed mode except the target, so keep
# all of them calibrated even if only some have voice commands.
modes:
  all_pick:
    label: "Олл пик"
  turbo:
    label: "Турбо"
  single_draft:
    label: "Сингл драфт"
  random_draft:
    label: "Рэндом драфт"
  ability_draft:
    label: "Абилити драфт"
