# =============================================================================
# "Command -> steps" definitions. To add a new voice command, just add a new
# entry to this list - the core (src/dota_voice/actions.py) doesn't need to
# change as long as existing step types are reused.
#
# Available step types (type):
#   launch_process     - launch an exe if it isn't running yet; can wait for its window.
#   launch_uri         - open steam://... or any other URI via os.startfile.
#   wait_window        - wait for a window whose title contains a substring.
#   sleep              - pause for a number of seconds.
#   open_url_in_chrome - open a URL in a new Chrome tab.
#   click_template     - find a template on screen (OpenCV) and click its center.
#   click_point        - click fixed coordinates (fallback).
#   key_press          - press a key/combo (pyautogui hotkey).
#   notify             - speak/log a message to the user.
#   select_exclusive_role - Dota's role icons are toggles, not an exclusive
#                        choice: clicking one doesn't clear the others. This
#                        step reads the "role" param from context, clicks off
#                        every role_<id>_selected.png match that isn't the
#                        target role, then clicks role_<target>.png if it
#                        isn't already selected. Needs both role_<id>.png and
#                        role_<id>_selected.png templates for every role (see
#                        README, calibration section).
#   ensure_dota_ready  - checks the Steam -> Dota 2 chain at whatever stage
#                        it's currently in: skips Steam if it's already
#                        running, skips launching Dota 2 if its process is
#                        already up, and always finishes by restoring/
#                        focusing the Dota 2 window (covers "already open
#                        but minimized"). On a fresh launch, watches for
#                        templates/intro_splash*.png (optional, see
#                        config.yaml -> vision) and presses Escape as soon as
#                        one is actually detected, then waits for play_button
#                        to confirm the main menu has finished loading.
#                        Takes no fields.
#   select_exclusive_mode - normal-game mode checkboxes, same idea as
#                        select_exclusive_role: reads the "mode" param,
#                        expands "Показать все режимы" (clicking
#                        modes_show_all_collapsed.png) only if some listed
#                        mode isn't visible, refuses to go on until every
#                        listed mode is on screen, unticks
#                        every other mode listed in config.yaml -> modes and
#                        ticks the target, re-checking the screen until only
#                        the target is ticked. Needs mode_<id>.png and
#                        mode_<id>_selected.png (checkbox + label) for every
#                        listed mode.
#   open_section       - opens a play-menu section only if it's closed:
#                        `template` is the header as it looks while the
#                        section is open, `inactive_template` while it's
#                        closed. Clicks the header only when the closed look
#                        matches better; does nothing if already open.
#   parallel           - `branches:` is a list of step lists. Branches run
#                        at the same time (one thread each); steps inside a
#                        branch run in order, so put dependent steps in the
#                        same branch. All branches are awaited; a failing
#                        required step in any branch fails the whole step
#                        after the others finish. Don't put notify steps or
#                        two UI-clicking steps in different branches.
#
# Phrases are matched fuzzily, but every word of a phrase must be heard, in
# the phrase's order. With speech.restrict_vocabulary on, the recognizer only
# knows the words used here - words missing from the speech model are logged
# at startup and can't be recognized.
#
# Step fields can use the {role} placeholder - it is substituted from the
# parameter extracted by the command matcher (see role_param).
#
# `region_key: <name>` on a click_template/select_exclusive_role step limits
# template matching to config.yaml's vision.region_<name> (calibrated with
# `python tools/calibrate.py --region <name>`), which is several times
# faster than the default full-screen search. Safe no-op if that region
# hasn't been calibrated - falls back to searching the whole screen.
#
# A command marked with `control: stop` is handled specially by
# src/dota_voice/app.py: it bypasses the busy-lock (so it fires even while
# another command's steps are still running) and, instead of running
# `steps`, asks ActionExecutor to interrupt whatever is currently in
# progress (mid-retry clicks, mid-wait for a window, etc.) - see
# ActionExecutor.request_stop() in actions.py.
# =============================================================================

commands:
  - id: stop
    description: "Interrupt whatever command is currently running"
    phrases:
      - "стоп"
      - "стой"
      - "остановись"
      - "останови"
      - "остановить"
      - "прекрати"
      - "хватит"
      - "отмена"
      - "отмени"
      - "отменить"
      - "стоп команда"
    match_threshold: 85
    control: stop

  - id: basic_minimum
    description: "Launch Steam, Dota 2, Chrome with Yandex Music, and Discord"
    phrases:
      - "базовый минимум"
      - "базовый набор"
      - "старт базовый минимум"
      - "запусти базовый минимум"
      - "стандартный набор"
      - "запусти все программы"
      - "открой все программы"
      - "запусти все приложения"
    match_threshold: 82
    steps:
      - type: notify
        text: "Выполняю: базовый минимум"

      # Independent apps start at the same time; each branch keeps its own
      # dependency order (Steam -> Dota 2, Chrome window -> Yandex Music tab).
      - type: parallel
        branches:
          # Same logic as ranked_role: reuses a running Steam/Dota, skips the
          # intro splash, waits for the main menu.
          - - type: ensure_dota_ready

          - - type: launch_process
              app: chrome
              wait_window: true
              timeout_key: process_launch_sec
            - type: sleep
              seconds_key: after_chrome_launch
            - type: open_url_in_chrome
              url: "https://music.yandex.ru"

          - - type: launch_process
              app: discord
              wait_window: false
              optional: true
              timeout_key: process_launch_sec

      - type: notify
        text: "Базовый минимум выполнен"

  - id: ranked_role
    description: "Start a Ranked Roles match for the given position"
    phrases:
      - "начни рейтинговую игру на {role}"
      - "начать рейтинговую игру на {role}"
      - "запусти рейтинговую игру на {role}"
      - "найди рейтинговую игру на {role}"
      - "запусти рейтинг на {role}"
      - "начни рейтинг на {role}"
      - "рейтинговый матч на {role}"
      - "рейтинговая игра на {role}"
      - "поиск рейтинга на {role}"
      - "играть рейтинг на {role}"
      - "рейтинг на {role}"
      - "ранкед на {role}"
    role_param: role
    match_threshold: 75
    steps:
      - type: notify
        text: "Выполняю: рейтинговая игра, роль - {role_label}"

      - type: ensure_dota_ready

      - type: sleep
        seconds_key: between_ui_clicks

      # play_button/ranked_roles_tab are marked optional with a short retry
      # budget: if the user is already past that screen (clicked Play or
      # opened Ranked Roles manually, or this is a repeat role command),
      # the template simply won't be on screen - skip it and move on instead
      # of burning the full retry budget and aborting the whole sequence.
      - type: click_template
        template: play_button
        retries: 2
        optional: true
        region_key: play_button

      - type: sleep
        seconds_key: between_ui_clicks

      # Clicks the "Рейтинговая игра" header only if that section is closed
      # (e.g. the normal-game section is open instead).
      - type: open_section
        template: ranked_roles_tab
        inactive_template: ranked_roles_tab_inactive
        retries: 2
        optional: true

      - type: sleep
        seconds_key: between_ui_clicks

      - type: select_exclusive_role
        retries_key: max_retries
        region_key: role_icons

      - type: sleep
        seconds_key: between_ui_clicks

      - type: click_template
        template: find_match_button
        retries_key: max_retries
        region_key: find_match_button

      - type: notify
        text: "Поиск игры запущен, роль - {role_label}"

  # Normal (unranked) game in a single mode. `params` are passed to the steps
  # as-is, the same way role_param passes the recognized role.
  - id: normal_turbo
    description: "Start a normal Turbo match (only Turbo ticked)"
    phrases:
      - "запусти турбо"
      - "начни турбо"
      - "играть турбо"
      - "найди турбо"
      - "поиск турбо"
      - "турбо режим"
      - "режим турбо"
      - "турбо игра"
      - "турбо матч"
      - "игра в турбо"
      - "обычная игра турбо"
      - "начни обычную игру турбо"
      - "запусти обычную игру турбо"
    params: {mode: turbo, mode_label: "Турбо"}
    match_threshold: 80
    steps: &normal_game_steps
      - type: notify
        text: "Выполняю: обычная игра, режим - {mode_label}"

      - type: ensure_dota_ready

      - type: sleep
        seconds_key: between_ui_clicks

      - type: click_template
        template: play_button
        retries: 2
        optional: true
        region_key: play_button

      - type: sleep
        seconds_key: between_ui_clicks

      # Clicks the "Обычная игра" header only if that section is closed
      # (e.g. the ranked section is open instead).
      - type: open_section
        template: normal_game_tab
        inactive_template: normal_game_tab_inactive
        retries: 2
        optional: true

      - type: sleep
        seconds_key: between_ui_clicks

      # Expands "Показать все режимы" if collapsed, then leaves only the
      # target mode ticked - see select_exclusive_mode in the header.
      # region_key is optional here, like for roles.
      - type: select_exclusive_mode
        retries: 4
        region_key: mode_list

      - type: sleep
        seconds_key: between_ui_clicks

      - type: click_template
        template: find_match_button
        retries_key: max_retries
        region_key: find_match_button

      - type: notify
        text: "Поиск игры запущен, режим - {mode_label}"

  - id: normal_all_pick
    description: "Start a normal All Pick match (only All Pick ticked)"
    phrases:
      - "запусти олл пик"
      - "начни олл пик"
      - "играть олл пик"
      - "найди олл пик"
      - "поиск олл пик"
      - "режим олл пик"
      - "олл пик игра"
      - "обычная игра олл пик"
      - "начни обычную игру олл пик"
      - "запусти обычную игру олл пик"
      - "запусти ол пик"
      - "запусти алл пик"
      - "запусти олпик"
    params: {mode: all_pick, mode_label: "Олл пик"}
    match_threshold: 80
    steps: *normal_game_steps
